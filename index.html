:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#0d1a2e; --muted:#56657d; --line:#dbe2ee;
  --key:#d9e2f0; --fn:#b9d0f2; --fn-ink:#0d1a2e; --clr:#fbdadf; --clr-ink:#a81f36;
  --accent:#0b7f87; --accent-ink:#ffffff; --hero:#0d1a2e; --accent-soft:#d3ecee; --accent-deep:#075e66;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b1220; --card:#141f33; --ink:#eef3fc; --muted:#92a3bf; --line:#25344f; --key:#1e2d4a; --fn:#2e4a7a; --fn-ink:#eef3fc; --clr:#4a2735; --clr-ink:#ff9fa9; --accent:#4fd1c5; --accent-ink:#04282b; --hero:#f2f6fd; --accent-soft:#143d3f; --accent-deep:#8ae8de;}
}
:root[data-theme="dark"]{--bg:#0b1220; --card:#141f33; --ink:#eef3fc; --muted:#92a3bf; --line:#25344f; --key:#1e2d4a; --fn:#2e4a7a; --fn-ink:#eef3fc; --clr:#4a2735; --clr-ink:#ff9fa9; --accent:#4fd1c5; --accent-ink:#04282b; --hero:#f2f6fd; --accent-soft:#143d3f; --accent-deep:#8ae8de;}
html{height:100%;touch-action:pan-x pan-y;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;padding:14px 16px 30px;gap:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;touch-action:pan-x pan-y}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.rate{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--ink);text-align:left}
.rate b{font-size:17px;font-weight:700}
.rate span{font-size:13px;color:var(--muted)}
.rate .edit{font-size:14px;font-weight:700;color:var(--accent)}

.screen{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:4px 6px 6px}
.expr{font-size:clamp(26px,8vw,34px);font-weight:500;line-height:1.15;overflow-wrap:anywhere;color:var(--ink)}
.expr.empty{color:var(--muted);font-size:20px}
.idr{font-size:17px;color:var(--muted)}
.hero{font-size:clamp(46px,15vw,64px);font-weight:600;line-height:1;letter-spacing:-.025em;color:var(--hero);margin-top:6px;overflow-wrap:anywhere}
.hero{align-self:flex-start;max-width:100%;cursor:pointer;transition:opacity .12s}
.hero:active{opacity:.6}
.hero:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.hero.long{font-size:clamp(36px,11vw,48px)}
.hero .cur{color:var(--accent)}
.fee{font-size:15px;color:var(--muted);min-height:20px;margin-top:2px}
.fee b{color:var(--ink);font-weight:600}
.chk{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:15px;font-weight:600;cursor:pointer}
dialog .chk input{flex:none;width:22px;height:22px;padding:0;margin:0;border:0;background:none;accent-color:var(--accent)}
.chk small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .rate{align-self:auto;min-width:0;flex:0 1 auto}
.tally{flex:none;background:none;border:0;color:var(--ink);text-align:right;padding:2px 6px;margin:0 -6px 0 0;border-radius:10px;line-height:1.2}
.tally span{display:block}
.tally .t1{font-size:14px;color:var(--muted)}
.tally .t2{font-size:26px;font-weight:700;letter-spacing:-.015em;transition:color .5s ease}
.tally .l{display:inline;font-size:13px;font-weight:600;color:var(--muted);margin-right:7px;letter-spacing:.02em}
.tally .t1 span,.tally .t2 span{display:inline}
.tally.pop .t2{color:var(--accent);transition-duration:.12s}



.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;--kh:clamp(54px,8.4dvh,70px)}
.k{height:var(--kh);border:0;border-radius:16px;background:var(--key);color:var(--ink);font-size:26px;font-weight:500}
.k:active{transform:scale(.96)}
.k.fn{background:var(--fn);color:var(--fn-ink)}
.k.go{background:var(--accent);color:var(--accent-ink);font-size:32px}
.k.clr{background:var(--clr);color:var(--clr-ink)}
.k.on{background:var(--accent-soft);color:var(--accent-deep);border:2px solid var(--accent)}
.k svg{display:block;margin:auto}
.k[data-d="."]{font-size:0}
.k[data-d="."]::before{content:"";display:block;width:9px;height:9px;border-radius:50%;background:currentColor;margin:auto}
.k.wide{grid-column:span 2}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:20px;width:min(340px,calc(100% - 32px));font-family:inherit}
dialog::backdrop{background:rgba(5,10,20,.5)}
dialog h2{margin:0 0 4px;font-size:18px}
dialog p{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.45}
dialog .row{display:flex;align-items:center;gap:10px}
dialog input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px inherit;font-family:inherit;border-radius:12px;padding:10px 12px}
dialog .per{font-size:14px;color:var(--muted);white-space:nowrap}
dialog .act{display:flex;gap:10px;margin-top:16px}
dialog .act button{flex:1;height:46px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--fn);color:var(--fn-ink)}
dialog .act .save{background:var(--accent);color:var(--accent-ink)}
dialog .sum{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);font-size:16px;color:var(--muted)}
dialog .sum b{font-size:24px;font-weight:700;color:var(--ink)}
dialog .act .reset{background:var(--clr);color:var(--clr-ink)}
#tdlg[open]{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
#tdlg .act{flex:none}
.tot{flex:none;padding:2px 0 14px}
.tot small{display:block;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.tot b{display:block;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.tot span{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.dwrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.days{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;margin:0 -6px;padding:2px 6px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%)}
.days::-webkit-scrollbar{display:none}
.sb{position:absolute;right:-3px;top:0;width:3px;border-radius:2px;background:var(--muted);opacity:0;transition:opacity .3s;pointer-events:none}
.sb.on{opacity:.6;transition-duration:.12s}
.dl{position:relative}
.day{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:10px;height:34px;margin-bottom:2px;font-size:15px;color:var(--muted)}
.day span:last-child{text-align:right}
.trk{height:14px}
.day i{display:block;height:100%;border-radius:7px;background:var(--accent);opacity:.35}
.day.today{color:var(--ink);font-weight:700}
.day.today i{opacity:1}
.day{cursor:pointer}
.det{padding:0 2px 8px 4px;font-size:14px;color:var(--muted)}
.det div{display:flex;justify-content:space-between;padding:3px 0}
.tfoot{flex:none;margin-top:12px;display:flex;flex-direction:column;gap:4px}
.tfoot .close{height:46px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--fn);color:var(--fn-ink)}
.tfoot .rst{height:40px;border:0;background:none;color:var(--clr-ink);font-size:14px;font-weight:600}
.err{color:#c0392b;font-size:13px;margin-top:8px}
.err:empty{display:none}
@media (prefers-color-scheme: dark){.err{color:#ff8a7a}}
@media (prefers-reduced-motion: reduce){.k:active{transform:none}.tally .t2{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
  <button class="rate" id="rateBtn" type="button" aria-label="Edit exchange rate">
    <div>
      <b id="rateMain">A$1 = Rp 12,650</b><br>
      <span id="rateSub">Rp 1k = A$0.08</span>
    </div>
  </button>

  <button class="tally" id="tally" type="button" aria-label="Spending totals. Tap to view or reset">
    <span class="t1"><span class="l">Trip</span><span id="tTrip">0.00</span></span>
    <span class="t2"><span class="l">Today</span><span id="t24">0.00</span></span>
  </button>
  </div>

  <section class="screen" aria-live="polite">
    <div class="expr empty" id="expr">Zeros are added for you</div>
    <div class="idr" id="idr"></div>
    <div class="hero" id="hero" role="button" tabindex="0" aria-description="Double-tap to log this spend"><span class="cur">A$</span>0.00</div>
    <div class="fee" id="fee"></div>
  </section>

  <div class="pad" role="group" aria-label="Keypad">
    <button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button>
    <button class="k clr" data-a="clear" aria-label="Clear">C</button>
    <button class="k" data-d="4">4</button><button class="k" data-d="5">5</button><button class="k" data-d="6">6</button>
    <button class="k fn" data-a="back" aria-label="Delete"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m13 9.5 5 5m0-5-5 5"/></svg></button>
    <button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button>
    <button class="k go" data-a="add" aria-label="Add another amount">+</button>
    <button class="k wide" data-d="0">0</button>
    <button class="k" data-d="." aria-label="Decimal point">.</button>
    <button class="k fn" id="milBtn" data-a="mil" aria-pressed="false" aria-label="Millions">M</button>
  </div>
</main>

<dialog id="tdlg" aria-label="Spending">
  <div class="tot"><small>Trip total</small><b id="dT">A$0</b></div>
  <div class="dwrap"><div class="days" id="days" aria-label="Spending by day"></div><i class="sb" id="sb"></i></div>
  <div class="tfoot"><button type="button" class="close" id="tCancel">Close</button><button type="button" class="rst" id="tReset">Reset all</button></div>
</dialog>

<dialog id="dlg">
  <h2>Rate &amp; card fee</h2>
  <p>Enter today’s rate. Saved on this device.</p>
  <div class="row"><input id="rateIn" type="text" inputmode="decimal" aria-label="Rupiah per Australian dollar"><span class="per">Rp per A$1</span></div>
  <div class="err" id="rateErr"></div>
  <label class="chk"><input type="checkbox" id="feeIn"><span>Include 2% card fee<small>Added to all amounts and totals</small></span></label>
  <div class="act"><button type="button" id="cancel" autofocus>Cancel</button><button type="button" class="save" id="save">Save</button></div>
</dialog>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var rate=12650;
  try{var sv=parseFloat(localStorage.getItem('idraud_rate')); if(sv>0) rate=sv;}catch(e){}
  var FEE=0.02, feeOn=true;
  try{ if(localStorage.getItem('idraud_fee')==='0') feeOn=false; }catch(e){}
  var mult=function(){return feeOn?1+FEE:1};
  var st=[{s:'',m:false}];
  var last=function(){return st[st.length-1]};
  var aud=function(n,d){return n.toLocaleString('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d})};

  function press(d){
    var t=last();
    if(d==='.'){ if(t.s.indexOf('.')>-1) return; if(!t.s) t.s='0'; t.s+='.'; }
    else{ if(t.s==='0') t.s=d; else if(t.s.length<9) t.s+=d; }
    render();
  }
  function back(){
    var t=last();
    if(t.s){ t.s=t.s.slice(0,-1); if(!t.s) t.m=false; }
    else if(st.length>1) st.pop();
    render();
  }
  function add(){ if(last().s && st.length<12) st.push({s:'',m:false}); render(); }
  function mil(){ var t=last(); t.m=!t.m; render(); }
  function clr(){ st=[{s:'',m:false}]; render(); }

  function render(){
    var terms=st.filter(function(t){return t.s});
    var total=terms.reduce(function(a,t){return a+parseFloat(t.s)*(t.m?1e6:1e3)},0);
    var ex=$('expr');
    if(!terms.length){ ex.textContent='Zeros are added for you'; ex.className='expr empty'; }
    else{
      var txt=terms.map(function(t){return t.s+(t.m?' M':' k')}).join(' + ');
      if(st.length>1 && !last().s) txt+=' +';
      ex.textContent=txt; ex.className='expr';
    }
    $('idr').textContent = total ? '= Rp ' + Math.round(total).toLocaleString('en-AU') : '';
    var base=total/rate, h=aud(base*mult(),2);
    var b2=Math.round(base*100)/100, w2=Math.round(base*mult()*100)/100;
    var fe=$('fee'); fe.textContent='';
    if(feeOn&&total){ var fb=document.createElement('b'); fb.textContent='A$'+aud(w2-b2,2); fe.appendChild(fb); fe.appendChild(document.createTextNode(' card fee included')); }
    $('hero').innerHTML='<span class="cur">A$</span>'+h;
    $('hero').className='hero'+(h.length>9?' long':'');
    var mb=$('milBtn'); mb.setAttribute('aria-pressed',last().m?'true':'false');
    mb.className='k '+(last().m?'on':'fn');
    $('rateMain').textContent='A$1 = Rp '+Math.round(rate).toLocaleString('en-AU');
    $('rateSub').textContent='Rp 1k = A$'+aud(1000/rate,3);
  }

  document.querySelector('.pad').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.d!==undefined) press(b.dataset.d);
    else if(b.dataset.a==='back'){ if(e.detail===0) back(); }
    else if(b.dataset.a==='add') add();
    else if(b.dataset.a==='mil') mil();
    else if(b.dataset.a==='clear') clr();
  });

  document.addEventListener('keydown',function(e){
    if($('dlg').open || $('tdlg').open || e.ctrlKey || e.metaKey || e.altKey) return;
    var k=e.key;
    if(/^[0-9]$/.test(k)) press(k);
    else if(k==='.'||k===',') press('.');
    else if(k==='+'||k==='Enter') add();
    else if(k==='m'||k==='M') mil();
    else if(k==='Backspace') back();
    else if(k==='Escape') clr();
    else return;
    e.preventDefault();
  });

  var bk=document.querySelector('[data-a="back"]'), rt=null, ri=null;
  function stopRep(){ clearTimeout(rt); clearInterval(ri); }
  bk.addEventListener('pointerdown',function(e){ e.preventDefault(); back(); stopRep(); rt=setTimeout(function(){ ri=setInterval(back,70); },420); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ bk.addEventListener(ev,stopRep); });
  window.addEventListener('blur',stopRep);
  document.querySelector('main').addEventListener('contextmenu',function(e){ e.preventDefault(); });

  var dlg=$('dlg');
  $('rateBtn').addEventListener('click',function(){ $('rateIn').value=Math.round(rate*100)/100; $('feeIn').checked=feeOn; $('rateErr').textContent=''; dlg.showModal(); });
  $('cancel').addEventListener('click',function(){dlg.close()});
  $('rateIn').addEventListener('focus',function(){ var el=this; setTimeout(function(){ el.select(); },0); });
  function saveRate(){
    var v=parseFloat(String($('rateIn').value).replace(/,/g,''));
    if(!(v>0)){ $('rateErr').textContent='Enter a number above 0'; return; }
    rate=v; try{localStorage.setItem('idraud_rate',String(v));}catch(e){}
    feeOn=$('feeIn').checked; try{localStorage.setItem('idraud_fee',feeOn?'1':'0');}catch(e){}
    dlg.close(); render();
  }
  $('save').addEventListener('click',saveRate);
  $('rateIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();saveRate();} });

  var KEY='idraud_spends', spends=[];
  try{ var raw=JSON.parse(localStorage.getItem(KEY)||'[]'); if(Array.isArray(raw)) spends=raw.filter(function(x){return x&&x.a>0&&x.t>0}); }catch(e){}
  function saveSpends(){ try{localStorage.setItem(KEY,JSON.stringify(spends));}catch(e){} }
  function sums(){ var d0=new Date(); d0.setHours(0,0,0,0); d0=d0.getTime(); var tr=0,dy=0; spends.forEach(function(x){ tr+=x.a; if(x.t>=d0) dy+=x.a; }); return {tr:tr,dy:dy}; }
  function renderTally(){ var s=sums(); $('tTrip').textContent=aud(s.tr,2); $('t24').textContent=aud(s.dy,2); }
  function entryIdr(){ return st.filter(function(t){return t.s}).reduce(function(a,t){return a+parseFloat(t.s)*(t.m?1e6:1e3)},0); }

  var lastTap=0;
  function logSpend(){
    var tot=entryIdr(); if(!(tot>0)) return;
    spends.push({t:Date.now(),a:tot/rate*mult()}); saveSpends(); clr(); renderTally();
    try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
    var tl=$('tally'); tl.classList.add('pop'); setTimeout(function(){tl.classList.remove('pop')},700);
  }
  $('hero').addEventListener('click',function(){
    var n=Date.now();
    if(n-lastTap<350){ lastTap=0; logSpend(); } else { lastTap=n; }
  });
  $('hero').addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); logSpend(); } });


  function dayStart(ts){ var d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
  function renderDays(){
    var map={}, days=[];
    spends.forEach(function(x){ var k=dayStart(x.t); if(!map[k]){ map[k]={k:k,a:0,it:[]}; days.push(map[k]); } map[k].a+=x.a; map[k].it.push(x); });
    days.sort(function(a,b){return b.k-a.k});
    var box=$('days'); box.textContent=''; var wrap=document.createElement('div'); wrap.className='dl'; box.appendChild(wrap);
    var tk=dayStart(Date.now()), y=new Date(tk); y.setDate(y.getDate()-1); var yk=y.getTime();
    
    var mx=days.reduce(function(m,d){return Math.max(m,d.a)},0)||1;
    days.forEach(function(d){
      var r=document.createElement('div'); r.className='day'+(d.k===tk?' today':'');
      var bar=document.createElement('i'); bar.style.width=Math.max(3,d.a/mx*100)+'%';
      var l=document.createElement('span');
      l.textContent=d.k===tk?'Today':d.k===yk?'Yesterday':new Date(d.k).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
      var v=document.createElement('span'); v.textContent=aud(d.a,0);
      var trk=document.createElement('div'); trk.className='trk'; trk.appendChild(bar); r.appendChild(l); r.appendChild(trk); r.appendChild(v); wrap.appendChild(r);
      var det=document.createElement('div'); det.className='det'; det.hidden=true;
      d.it.sort(function(a,b){return a.t-b.t}).forEach(function(x){ var q=document.createElement('div'); var tm=document.createElement('span'); tm.textContent=new Date(x.t).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false}); var am=document.createElement('span'); am.textContent='A$'+aud(x.a,2); q.appendChild(tm); q.appendChild(am); det.appendChild(q); });
      wrap.appendChild(det);
      r.addEventListener('click',function(){ det.hidden=!det.hidden; updSb(); });
    });
    
  }
  var tdlg=$('tdlg'), sbT=null;
  function flashSb(){ var s=$('sb'); s.classList.add('on'); clearTimeout(sbT); sbT=setTimeout(function(){ s.classList.remove('on'); },900); }
  function updSb(){
    var b=$('days'), s=$('sb'), h=b.clientHeight, sh=b.scrollHeight, F=18;
    if(sh<=h+1){ s.style.display='none'; b.style.setProperty('--ft','0px'); b.style.setProperty('--fb','0px'); return false; }
    s.style.display='';
    var th=Math.max(28,h*h/sh), top=b.scrollTop/(sh-h)*(h-th);
    s.style.height=th+'px'; s.style.transform='translateY('+top+'px)';
    b.style.setProperty('--ft',b.scrollTop>2?F+'px':'0px');
    b.style.setProperty('--fb',b.scrollTop<sh-h-2?F+'px':'0px');
    return true;
  }
  $('days').addEventListener('scroll',function(){ if(updSb()) flashSb(); },{passive:true});
  $('tally').addEventListener('click',function(){ var s=sums(); $('dT').textContent='A$'+aud(s.tr,0); renderDays(); tdlg.showModal(); if(updSb()) flashSb(); });
  $('tCancel').addEventListener('click',function(){tdlg.close()});
  var rTimer=null, rArmed=false;
  function disarm(){ rArmed=false; clearTimeout(rTimer); $('tReset').textContent='Reset all'; }
  $('tReset').addEventListener('click',function(){
    if(!rArmed){ rArmed=true; this.textContent='Tap again to erase everything'; rTimer=setTimeout(disarm,4000); return; }
    disarm(); spends=[]; saveSpends(); renderTally(); tdlg.close();
  });
  tdlg.addEventListener('close',disarm);
  setInterval(renderTally,60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) renderTally(); });

  render();
  renderTally();
})();
</script>
<script src="./pwa.js" defer></script>
</body>
</html>
